name: Actions Learning Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: Create output file
        run: |
          mkdir -p output
          echo "Hello from GitHub Actions!" > output/result.txt
          date -u >> output/result.txt
          echo "Workflow completed successfully." >> output/result.txt

      - name: Upload output file
        uses: actions/upload-artifact@v4
        with:
          name: learning-output
          path: output/result.txt
          if-no-files-found: error
          retention-days: 1
